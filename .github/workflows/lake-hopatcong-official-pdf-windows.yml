name: Lake Hopatcong Official Plan Windows

on:
  push:
    branches:
      - lakeblankets-stage2b-worker
    paths:
      - .github/workflows/lake-hopatcong-official-pdf-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download official management plan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lake-hopatcong-official-plan | Out-Null
          $url = 'https://www.nj.gov/dep/fgw/pdf/fwfisheries/lakeplan_hopatcong.pdf'
          $out = 'lake-hopatcong-official-plan/lake_hopatcong_fisheries_management_plan_2015.pdf'
          Invoke-WebRequest -Uri $url -OutFile $out -UserAgent 'LakeBlankets-Stage2B/1.0'
          $hash = (Get-FileHash -Path $out -Algorithm SHA256).Hash.ToLower()
          $meta = @{
            lake_id = 'LB-NJ-LAKE-HOPATCONG'
            title = 'Lake Hopatcong Fisheries Management Plan'
            publisher = 'New Jersey Division of Fish and Wildlife'
            publication_date = '2015-01'
            source_url = $url
            accessed_utc = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            pdf_sha256 = $hash
            bathymetry_reference_page = 24
            rights_use = 'Facts and internal design/geometry QA reference. Do not reproduce the embedded map as merchandise artwork without separate rights review.'
            status = 'OFFICIAL_REFERENCE_ACQUIRED'
          }
          $meta | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 'lake-hopatcong-official-plan/management_plan_metadata.json'
          "$hash  lake_hopatcong_fisheries_management_plan_2015.pdf" | Set-Content -Encoding ascii 'lake-hopatcong-official-plan/SHA256SUMS.txt'
      - name: Upload official plan
        uses: actions/upload-artifact@v4
        with:
          name: lake-hopatcong-official-management-plan-windows
          path: lake-hopatcong-official-plan/
          if-no-files-found: error
          retention-days: 7
