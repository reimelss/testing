name: Lake Blankets Stage 2B Twin Lakes Candidate Discovery

on:
  push:
    paths:
      - 'stage2b/twin_only_config.json'
      - 'stage2b/TWIN_TRIGGER.txt'
      - '.github/workflows/stage2b-twin.yml'
      - 'stage2b/candidate_discovery.py'
      - 'stage2b/requirements.txt'
  workflow_dispatch:

jobs:
  discover-twin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: stage2b/requirements.txt
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stage2b/requirements.txt
      - name: Query corrected Twin Lakes candidates
        run: |
          python stage2b/candidate_discovery.py stage2b/twin_only_config.json twin-output
      - name: Upload Twin Lakes candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-blankets-stage2b-twin-candidates
          path: twin-output/
          if-no-files-found: error
          retention-days: 14
